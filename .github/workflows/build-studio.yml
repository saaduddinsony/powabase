name: Build and Publish Studio Image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to ghcr.io'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/apps/studio/Dockerfile
          target: production
          platforms: linux/amd64
          push: ${{ inputs.push_image }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/powabase-studio:latest
          build-args: |
            NEXT_PUBLIC_IS_PLATFORM=false
            NEXT_PUBLIC_SITE_URL=http://localhost:8000
            NEXT_PUBLIC_DISABLED_FEATURES=billing:all,billing:plan_picker,credits:enabled,ai:project_copilot
